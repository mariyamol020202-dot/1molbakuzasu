<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Обратная связь — МолБаКуЗаСу</title>

  <link rel="stylesheet" href="css/style.css?v=4">
</head>

<body>

  <header class="header">

    <a class="logo" href="index.html">
      МОЛБАКУЗАСУ<span>®</span>
    </a>

    <button
      class="menu-btn"
      type="button"
      aria-label="Открыть меню"
      aria-expanded="false"
    >
      ☰
    </button>

    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="about.html">О нас</a>
      <a href="team.html">Наша команда</a>
      <a href="news.html">Новости</a>
      <a href="gallery.html">Медиатека</a>
      <a class="nav-cta active" href="contacts.html">Связаться</a>
    </nav>

  </header>


  <section class="page-hero">

    <p class="eyebrow">05 / FEEDBACK</p>

    <h1>
      Служба<br>
      поддержки семьи.
    </h1>

  </section>


  <section class="page-content">

    <div class="form-wrap">

      <p class="eyebrow">
        ОБРАЩЕНИЕ В СЕМЕЙНОЕ РУКОВОДСТВО
      </p>

      <h2>Что случилось?</h2>

      <p class="form-explainer">
        Оставьте сообщение — оно попадёт прямо семейному руководству.
      </p>


      <form
        class="form"
        id="feedbackForm"
        action="https://formspree.io/f/xqpzwjao"
        method="POST"
      >

        <input
          type="hidden"
          name="subject"
          value="Новое сообщение с семейного сайта МолБаКуЗаСу"
        >


        <label>
          Ваше имя

          <input
            required
            name="name"
            maxlength="80"
            placeholder="Например, Соня"
          >
        </label>


        <label>
          Тип обращения

          <select name="type">

            <option>❤️ Похвала</option>

            <option>😡 Жалоба</option>

            <option>💡 Предложение</option>

            <option>
              😂 Просто хотел(а) что-то сказать
            </option>

          </select>
        </label>


        <label>
          Сообщение

          <textarea
            required
            maxlength="2000"
            name="message"
            placeholder="Пишите всё как есть..."
          ></textarea>
        </label>


        <button
          class="button button-dark"
          type="submit"
        >
          Отправить руководству →
        </button>

      </form>


      <div
        class="form-status"
        id="formStatus"
        aria-live="polite"
      ></div>

    </div>
